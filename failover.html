<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0a0a0c" />
  <title>Bakım Çalışması · KBUPDF</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --surface: rgba(24, 24, 27, 0.72);
      --border: rgba(255, 255, 255, 0.09);
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #f59e0b;
      --accent-soft: #fbbf24;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background: var(--bg) url("failover.png") center / cover no-repeat;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(70% 90% at 78% 30%, rgba(10, 10, 12, 0.15), rgba(10, 10, 12, 0.82) 78%),
        linear-gradient(115deg, rgba(10, 10, 12, 0.94) 0%, rgba(10, 10, 12, 0.82) 50%, rgba(10, 10, 12, 0.62) 100%);
      pointer-events: none;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 660px;
      padding: 48px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(251, 191, 36, 0.65), transparent);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(251, 191, 36, 0.35);
      background: rgba(251, 191, 36, 0.08);
      color: #fcd34d;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-soft);
      box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.45);
      animation: pulse 2s ease-out infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.45); }
      70% { box-shadow: 0 0 0 8px rgba(251, 191, 36, 0); }
      100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
    }

    h1 {
      margin: 20px 0 12px;
      font-size: clamp(26px, 4.5vw, 40px);
      line-height: 1.15;
      letter-spacing: -0.02em;
      font-weight: 700;
    }

    .lead {
      margin: 0 0 32px;
      max-width: 52ch;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .lead strong { color: #e4e4e7; font-weight: 600; }

    .countdown {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 18px 8px 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
    }

    .num {
      font-size: clamp(34px, 7vw, 52px);
      font-weight: 700;
      line-height: 1;
      color: var(--accent-soft);
      font-variant-numeric: tabular-nums;
    }

    .label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .target {
      margin: 16px 0 0;
      font-size: 13px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .target .tz { opacity: 0.7; }

    .actions {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 20px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #18181b;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    button:hover {
      background: #fbbf24;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.28);
    }

    button:active { transform: translateY(0); }

    button:focus-visible {
      outline: 2px solid var(--accent-soft);
      outline-offset: 3px;
    }

    @media (max-width: 560px) {
      .card { padding: 32px 22px; border-radius: 20px; }
      .countdown { gap: 8px; }
      .unit { padding: 14px 4px 12px; border-radius: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
      button { transition: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge"><span class="dot"></span>Bakım çalışması</div>
    <h1>Sitemiz kısa bir arada</h1>
    <p class="lead">
      KBUPDF şu anda planlı bir bakım çalışması nedeniyle geçici olarak hizmet veremiyor.
      Sabah <strong>09:00</strong>'da yeniden yayında olacağız. Anlayışınız için teşekkür ederiz.
    </p>

    <div class="countdown" role="timer" aria-label="09:00'a kalan süre">
      <div class="unit"><span class="num" id="hours">00</span><span class="label">Saat</span></div>
      <div class="unit"><span class="num" id="minutes">00</span><span class="label">Dakika</span></div>
      <div class="unit"><span class="num" id="seconds">00</span><span class="label">Saniye</span></div>
    </div>

    <p class="target">Hedef: <span id="target-date">—</span> <span class="tz">(TSİ)</span></p>

    <div class="actions">
      <button type="button" id="retry">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36" />
          <path d="M21 3v6h-6" />
        </svg>
        Yeniden Dene
      </button>
    </div>
  </main>

  <script>
    const OFFSET = 3 * 60 * 60 * 1000;
    const pad = (n) => String(n).padStart(2, "0");

    function nextTarget() {
      const now = Date.now();
      const ist = new Date(now + OFFSET);
      let target = Date.UTC(ist.getUTCFullYear(), ist.getUTCMonth(), ist.getUTCDate(), 9, 0, 0) - OFFSET;
      if (now >= target) target += 86_400_000;
      return target;
    }

    const target = nextTarget();
    const el = (id) => document.getElementById(id);

    el("target-date").textContent = new Intl.DateTimeFormat("tr-TR", {
      timeZone: "Europe/Istanbul",
      day: "numeric",
      month: "long",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }).format(target);

    let done = false;

    function tick() {
      const now = Date.now();
      const diff = Math.max(0, target - now);

      el("hours").textContent = pad(Math.floor(diff / 3_600_000));
      el("minutes").textContent = pad(Math.floor((diff % 3_600_000) / 60_000));
      el("seconds").textContent = pad(Math.floor((diff % 60_000) / 1000));

      if (diff === 0 && !done) {
        done = true;
        setTimeout(() => location.reload(), 3000);
      }
    }

    el("retry").addEventListener("click", () => location.reload());
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
